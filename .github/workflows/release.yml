name: Release promotion

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion-approval:
    name: Release / exact candidate and smoke approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: windows-11-live-smoke-approval
    permissions:
      actions: read
      contents: read
    outputs:
      approval_run_attempt: ${{ steps.gate.outputs.approval_run_attempt }}
      artifact_digest: ${{ steps.gate.outputs.artifact_digest }}
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      candidate_run_attempt: ${{ steps.gate.outputs.candidate_run_attempt }}
      candidate_run_id: ${{ steps.gate.outputs.candidate_run_id }}
      evidence_sha256: ${{ steps.gate.outputs.evidence_sha256 }}
      manifest_sha256: ${{ steps.gate.outputs.manifest_sha256 }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Validate protected main, tag, candidate run, artifact, and smoke attestation
        id: gate
        shell: bash
        env:
          APPROVED_SHA: ${{ vars.WINDOWS_11_LIVE_SMOKE_APPROVED_SHA }}
          APPROVED_TAG: ${{ vars.WINDOWS_11_LIVE_SMOKE_APPROVED_TAG }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ vars.RELEASE_CANDIDATE_ARTIFACT_DIGEST }}
          CANDIDATE_ARTIFACT_ID: ${{ vars.RELEASE_CANDIDATE_ARTIFACT_ID }}
          CANDIDATE_MANIFEST_SHA256: ${{ vars.RELEASE_CANDIDATE_MANIFEST_SHA256 }}
          CANDIDATE_RUN_ID: ${{ vars.RELEASE_CANDIDATE_RUN_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SMOKE_ARTIFACT_DIGEST: ${{ vars.WINDOWS_11_LIVE_SMOKE_ARTIFACT_DIGEST }}
          SMOKE_ARTIFACT_ID: ${{ vars.WINDOWS_11_LIVE_SMOKE_ARTIFACT_ID }}
          SMOKE_EVIDENCE_SHA256: ${{ vars.WINDOWS_11_LIVE_SMOKE_EVIDENCE_SHA256 }}
          SMOKE_MANIFEST_SHA256: ${{ vars.WINDOWS_11_LIVE_SMOKE_MANIFEST_SHA256 }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          strict_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ "$RELEASE_REF_TYPE" != tag || "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ||
                ! "$RELEASE_TAG" =~ $strict_tag_pattern ]]; then
            echo 'The release event is not an exact v-prefixed SemVer tag push.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ || "$DEFAULT_BRANCH" != main ]]; then
            echo 'The release SHA or default branch is invalid.' >&2
            exit 1
          fi
          if [[ "$APPROVED_SHA" != "$RELEASE_SHA" || "$APPROVED_TAG" != "$RELEASE_TAG" ]]; then
            echo 'The protected Environment approval does not exactly match this SHA and tag.' >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ||
                ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                ! "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ||
                ! "$CANDIDATE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$SMOKE_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'A candidate or Windows 11 evidence receipt variable is missing or malformed.' >&2
            exit 1
          fi
          if [[ "$SMOKE_ARTIFACT_ID" != "$CANDIDATE_ARTIFACT_ID" ||
                "$SMOKE_ARTIFACT_DIGEST" != "$CANDIDATE_ARTIFACT_DIGEST" ||
                "$SMOKE_MANIFEST_SHA256" != "$CANDIDATE_MANIFEST_SHA256" ]]; then
            echo 'The Windows 11 smoke attestation is not bound to the approved immutable candidate.' >&2
            exit 1
          fi

          api() {
            gh api -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }

          branch_json="$(api "/repos/$REPOSITORY/branches/main")"
          if [[ "$(jq -r '.name' <<<"$branch_json")" != main ||
                "$(jq -r '.protected' <<<"$branch_json")" != true ||
                "$(jq -r '.commit.sha' <<<"$branch_json")" != "$RELEASE_SHA" ]]; then
            echo 'The tag commit is not the exact current protected main commit.' >&2
            exit 1
          fi

          tag_json="$(api "/repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<<"$tag_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          if [[ "$(jq -r '.ref' <<<"$tag_json")" != "refs/tags/$RELEASE_TAG" || "$tag_type" != tag ]]; then
            echo 'The release ref must be an annotated tag.' >&2
            exit 1
          fi
          for _ in {1..8}; do
            [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'The annotated tag contains an invalid object SHA.' >&2
              exit 1
            }
            if [[ "$tag_type" == commit ]]; then
              break
            fi
            [[ "$tag_type" == tag ]] || {
              echo 'The annotated tag does not resolve to a commit.' >&2
              exit 1
            }
            tag_object_json="$(api "/repos/$REPOSITORY/git/tags/$tag_object_sha")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object_json")"
            tag_object_sha="$(jq -r '.object.sha' <<<"$tag_object_json")"
          done
          if [[ "$tag_type" != commit || "$tag_object_sha" != "$RELEASE_SHA" ]]; then
            echo 'The annotated tag does not resolve exactly to the release commit.' >&2
            exit 1
          fi

          run_json="$(api "/repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          if [[ "$(jq -r '.id' <<<"$run_json")" != "$CANDIDATE_RUN_ID" ||
                "$(jq -r '.path' <<<"$run_json")" != '.github/workflows/release-candidate.yml' ||
                "$(jq -r '.event' <<<"$run_json")" != workflow_dispatch ||
                "$(jq -r '.head_branch' <<<"$run_json")" != main ||
                "$(jq -r '.head_sha' <<<"$run_json")" != "$RELEASE_SHA" ||
                "$(jq -r '.head_repository.full_name' <<<"$run_json")" != "$REPOSITORY" ||
                "$(jq -r '.status' <<<"$run_json")" != completed ||
                "$(jq -r '.conclusion' <<<"$run_json")" != success ||
                ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo 'The approved candidate run is not a successful trusted release-candidate run for this commit.' >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          expected_artifact_name="release-candidate-$version-$RELEASE_SHA-$CANDIDATE_RUN_ID-$run_attempt"
          artifact_json="$(api "/repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          if [[ "$(jq -r '.id' <<<"$artifact_json")" != "$CANDIDATE_ARTIFACT_ID" ||
                "$(jq -r '.name' <<<"$artifact_json")" != "$expected_artifact_name" ||
                "$(jq -r '.expired' <<<"$artifact_json")" != false ||
                "$(jq -r '.digest' <<<"$artifact_json")" != "$CANDIDATE_ARTIFACT_DIGEST" ||
                "$(jq -r '.workflow_run.id' <<<"$artifact_json")" != "$CANDIDATE_RUN_ID" ||
                "$(jq -r '.workflow_run.head_branch' <<<"$artifact_json")" != main ||
                "$(jq -r '.workflow_run.head_sha' <<<"$artifact_json")" != "$RELEASE_SHA" ||
                "$(jq -r '.size_in_bytes' <<<"$artifact_json")" -le 0 ]]; then
            echo 'The immutable artifact API metadata does not match the approved candidate receipt.' >&2
            exit 1
          fi

          {
            echo "approval_run_attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "artifact_digest=$CANDIDATE_ARTIFACT_DIGEST"
            echo "artifact_id=$CANDIDATE_ARTIFACT_ID"
            echo "artifact_name=$expected_artifact_name"
            echo "candidate_run_attempt=$run_attempt"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "evidence_sha256=$SMOKE_EVIDENCE_SHA256"
            echo "manifest_sha256=$CANDIDATE_MANIFEST_SHA256"
            echo "release_sha=$RELEASE_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  draft-release:
    name: Release / promote tested bytes to draft
    needs: promotion-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download exact candidate archive by immutable artifact ID
        shell: bash
        env:
          APPROVAL_RUN_ATTEMPT: ${{ needs.promotion-approval.outputs.approval_run_attempt }}
          ARTIFACT_DIGEST: ${{ needs.promotion-approval.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.promotion-approval.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ||
                "$APPROVAL_RUN_ATTEMPT" != "$WORKFLOW_RUN_ATTEMPT" ]]; then
            echo 'The Environment approval is from a different workflow attempt; use Re-run all jobs and approve again.' >&2
            exit 1
          fi
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          actual_digest="sha256:$(sha256sum candidate.zip | awk '{print $1}')"
          if [[ "$actual_digest" != "$ARTIFACT_DIGEST" ]]; then
            echo "Candidate archive digest mismatch: $actual_digest" >&2
            exit 1
          fi
          mkdir candidate
          while IFS= read -r entry; do
            if [[ -z "$entry" || "$entry" == */ || "$entry" == *'/'* ||
                  "$entry" == *'\'* || "$entry" == .* || "$entry" == *..* ]]; then
              echo "Unsafe or nested artifact archive entry: $entry" >&2
              exit 1
            fi
          done < <(zipinfo -1 candidate.zip)
          unzip -q candidate.zip -d candidate

      - name: Verify manifest, exact payload, checksums, and provenance
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.promotion-approval.outputs.artifact_name }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.promotion-approval.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ needs.promotion-approval.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.promotion-approval.outputs.manifest_sha256 }}
          RELEASE_SHA: ${{ needs.promotion-approval.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.promotion-approval.outputs.version }}
        run: |
          set -euo pipefail
          manifest="candidate/distraction-firewall-$VERSION.candidate-manifest.json"
          subjects="candidate/distraction-firewall-$VERSION.candidate-subjects.sha256"
          provenance="candidate/distraction-firewall-$VERSION.provenance.bundle.json"
          actual_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          [[ "$actual_manifest_sha" == "$MANIFEST_SHA256" ]] || {
            echo 'Candidate manifest digest mismatch.' >&2
            exit 1
          }
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$RELEASE_SHA" \
            --arg version "$VERSION" \
            --arg workflowRef "$REPOSITORY/.github/workflows/release-candidate.yml@refs/heads/main" \
            --argjson runId "$CANDIDATE_RUN_ID" \
            --argjson runAttempt "$CANDIDATE_RUN_ATTEMPT" \
            '.schema == "distraction-firewall/build-once-candidate/v1" and
             .version == $version and
             .source.repository == $repository and
             .source.commitSha == $sha and
             .source.ref == "refs/heads/main" and
             .source.workflowPath == ".github/workflows/release-candidate.yml" and
             .source.workflowRef == $workflowRef and
             .source.workflowRunId == $runId and
             .source.workflowRunAttempt == $runAttempt and
             .source.artifactId == null and
             .source.artifactDigestSha256 == null and
             (.artifacts | keys) == ["appMsi", "checksum", "runtimeMsi", "sbom", "setupExe"] and
             (.signing | keys) == ["configured", "disclosure", "outerPackageStatuses"]' "$manifest" >/dev/null

          expected_artifact_name="release-candidate-$VERSION-$RELEASE_SHA-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT"
          [[ "$ARTIFACT_NAME" == "$expected_artifact_name" ]] || {
            echo 'Candidate artifact name does not match the manifest build identity.' >&2
            exit 1
          }
          expected_names=(
            "distraction-firewall-$VERSION.candidate-manifest.json"
            "distraction-firewall-$VERSION.candidate-subjects.sha256"
            "distraction-firewall-$VERSION.hosted-evidence.json"
            "distraction-firewall-$VERSION.provenance.bundle.json"
            "distraction-firewall-$VERSION.sha256"
            "distraction-firewall-$VERSION.spdx.json"
            "distraction-firewall-app-$VERSION-win-x64.msi"
            "distraction-firewall-runtime-$VERSION-win-x64.msi"
            "distraction-firewall-setup-$VERSION-win-x64.exe"
          )
          mapfile -t actual_names < <(
            find candidate -maxdepth 1 \( -type f -o -type l \) -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t sorted_expected_names < <(printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${sorted_expected_names[@]}") <(printf '%s\n' "${actual_names[@]}")

          while IFS=$'\t' read -r file_name expected_hash expected_size; do
            file_path="candidate/$file_name"
            [[ -f "$file_path" && ! -L "$file_path" ]] || {
              echo "Manifest subject is missing or is a symlink: $file_name" >&2
              exit 1
            }
            [[ "$(sha256sum "$file_path" | awk '{print $1}')" == "$expected_hash" ]] || {
              echo "Manifest subject hash mismatch: $file_name" >&2
              exit 1
            }
            [[ "$(stat -c '%s' "$file_path")" == "$expected_size" ]] || {
              echo "Manifest subject size mismatch: $file_name" >&2
              exit 1
            }
          done < <(jq -r '.artifacts | to_entries[] | [.value.fileName, .value.sha256, (.value.sizeBytes|tostring)] | @tsv' "$manifest")

          (cd candidate && sha256sum --strict --check "distraction-firewall-$VERSION.sha256")
          (cd candidate && sha256sum --strict --check "distraction-firewall-$VERSION.candidate-subjects.sha256")
          while IFS= read -r subject_name; do
            gh attestation verify "candidate/$subject_name" \
              --repo "$REPOSITORY" \
              --bundle "$provenance" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done < <(awk '{print $2}' "$subjects")

      - name: Create reviewed smoke binding
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.promotion-approval.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.promotion-approval.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.promotion-approval.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ needs.promotion-approval.outputs.candidate_run_id }}
          EVIDENCE_SHA256: ${{ needs.promotion-approval.outputs.evidence_sha256 }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.promotion-approval.outputs.manifest_sha256 }}
          RELEASE_SHA: ${{ needs.promotion-approval.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.promotion-approval.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.promotion-approval.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          promotion_path="candidate/distraction-firewall-$VERSION.windows11-smoke-promotion.json"
          [[ ! -e "$promotion_path" && ! -L "$promotion_path" ]] || {
            echo 'The candidate archive preoccupied the smoke-promotion record path.' >&2
            exit 1
          }
          jq -n \
            --arg actor "$GITHUB_ACTOR" \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg artifactId "$ARTIFACT_ID" \
            --arg artifactName "$ARTIFACT_NAME" \
            --arg evidenceSha256 "$EVIDENCE_SHA256" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg releaseSha "$RELEASE_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg runId "$CANDIDATE_RUN_ID" \
            '{
              schema: "distraction-firewall/windows11-smoke-promotion/v1",
              result: "approved",
              workflowActor: $actor,
              release: { tag: $releaseTag, commitSha: $releaseSha },
              candidate: {
                workflowRunId: ($runId | tonumber),
                artifactId: ($artifactId | tonumber),
                artifactName: $artifactName,
                artifactDigest: $artifactDigest,
                manifestSha256: $manifestSha256
              },
              localSmokeEvidenceSha256: $evidenceSha256
            }' > "$promotion_path"

      - name: Attest reviewed smoke binding
        id: smoke_promotion_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: candidate/distraction-firewall-${{ needs.promotion-approval.outputs.version }}.windows11-smoke-promotion.json

      - name: Add offline-verifiable smoke-promotion provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.smoke_promotion_provenance.outputs.bundle-path }}
          VERSION: ${{ needs.promotion-approval.outputs.version }}
        run: |
          set -euo pipefail
          [[ -f "$BUNDLE_PATH" && ! -L "$BUNDLE_PATH" ]] || {
            echo 'actions/attest did not produce a regular smoke-promotion provenance bundle.' >&2
            exit 1
          }
          destination="candidate/distraction-firewall-$VERSION.windows11-smoke-promotion.provenance.bundle.json"
          [[ ! -e "$destination" && ! -L "$destination" ]] || {
            echo 'The candidate archive preoccupied the smoke-promotion provenance path.' >&2
            exit 1
          }
          cp -- "$BUNDLE_PATH" "$destination"

      - name: Create immutable-ready draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.promotion-approval.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.promotion-approval.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.promotion-approval.outputs.version }}
        run: |
          set -euo pipefail

          manifest_signing="$(jq -r '.signing.configured' "candidate/distraction-firewall-$VERSION.candidate-manifest.json")"
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag=(--prerelease)
            if [[ "$manifest_signing" == true ]]; then
              alpha_header='Alpha prerelease. The candidate manifest records Valid Authenticode status for all three outer packages; inner PE signing is not claimed.'
            else
              alpha_header='Alpha prerelease. This build is unsigned.'
            fi
            notes="$alpha_header"$'\n\nBuild once / promote same bytes: GitHub Actions built and sealed the candidate exactly once from the current protected-main commit. A maintainer then ran the one-UAC Windows 11 smoke against that exact artifact ID, archive digest, and manifest digest. This draft attaches the same payload bytes downloaded by immutable artifact ID; the promotion workflow does not rebuild or resign them.\n\nThe one-UAC smoke covers installer/service recovery, standard-user CLI/UI checks, and uninstall/residual verification. It deliberately does not start a restriction lease and does not claim a live YouTube network-enforcement E2E result.\n\nThis Release remains a draft until its assets, provenance, and smoke evidence are reviewed. Version 0.1 must be installed by the same signed-in Windows account that will run the App. Over-the-shoulder elevation using another administrator account and LocalSystem/SYSTEM-managed deployment are unsupported.\n\nThe SPDX file is a distribution-artifact inventory skeleton, not a complete dependency SBOM. GitHub provenance covers the candidate subjects, and a separate GitHub attestation binds the Windows 11 promotion record and reviewed local evidence digest to the immutable Actions artifact.'
          else
            prerelease_flag=()
            notes=$'Stable-candidate draft. GitHub Actions built and sealed the candidate exactly once from the current protected-main commit. A maintainer ran the one-UAC Windows 11 installer/service recovery, standard-user CLI/UI, and uninstall smoke against that exact artifact ID, archive digest, and manifest digest. The smoke deliberately does not start a restriction lease and does not claim live YouTube network-enforcement E2E coverage. This draft attaches those same bytes without rebuilding. Publication requires a separate protected release-publication approval and a complete review of signatures, provenance, SBOM scope, and smoke evidence.'
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            candidate/* \
            --draft \
            --target "$RELEASE_SHA" \
            --verify-tag \
            --title "Distraction Firewall $VERSION" \
            "${prerelease_flag[@]}" \
            --notes "$notes"

          expected_prerelease=false
          [[ "$VERSION" == *-* ]] && expected_prerelease=true
          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != true ||
                "$(jq -r '.prerelease' <<<"$release_json")" != "$expected_prerelease" ||
                "$(jq -r '.tag_name' <<<"$release_json")" != "$RELEASE_TAG" ||
                "$(jq -r '.name' <<<"$release_json")" != "Distraction Firewall $VERSION" ||
                "$(jq -r '.target_commitish' <<<"$release_json")" != "$RELEASE_SHA" ]]; then
            echo 'The created draft Release metadata does not match the approved candidate.' >&2
            exit 1
          fi
