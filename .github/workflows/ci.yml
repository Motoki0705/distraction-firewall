name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-and-test:
    name: CI / build and test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        run: ./eng/restore.ps1

      - name: Verify formatting
        run: ./eng/format.ps1

      - name: Build
        run: ./eng/build.ps1 -Configuration Release

      - name: Test
        run: ./eng/test.ps1 -Configuration Release -ResultsDirectory '${{ runner.temp }}\distraction-firewall-test-results'

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\distraction-firewall-test-results\*.trx
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs:
      - build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [[ "$BUILD_AND_TEST_RESULT" != "success" ]]; then
            echo "Required job failed or was cancelled: build-and-test=$BUILD_AND_TEST_RESULT"
            exit 1
          fi
